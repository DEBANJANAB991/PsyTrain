<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultation · Meet Your AI Patient</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e8eaed; font-family: system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #status { position: fixed; left: 12px; top: 50px; padding: 4px 10px; border-radius: 999px; background: rgba(20,22,26,.72); font-size: 13px; pointer-events: none; }
    #back { position: fixed; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px;
            background: rgba(20,22,26,.72); backdrop-filter: blur(6px); color: inherit; text-decoration: none; font-size: 13px; }
    #back:hover { background: rgba(20,22,26,.9); }
    #back[hidden] { display: none; }
    #back b { font-weight: 600; }
    #back span { opacity: .75; }
    #debug { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 250px; padding: 12px; border-radius: 10px; overflow-y: auto;
             background: rgba(20,22,26,.88); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; }
    #debug[hidden] { display: none; }
    #debug h3 { margin: 6px 0 0; font-size: 12px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
    #debug button { padding: 6px 4px; border: 1px solid #3a3f47; border-radius: 6px; background: #22262c; color: inherit; cursor: pointer; font-size: 13px; }
    #debug button.active { background: #3b6df0; border-color: #3b6df0; }
    #debug label { font-size: 12px; opacity: .85; display: flex; flex-direction: column; gap: 2px; }
    #debug label span { float: right; opacity: .6; }
    #debug .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    /* talk bar: the page's only control */
    #talkbar { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(560px, calc(100% - 24px));
               display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
    #talkbar[hidden] { display: none; }
    #talkbar > * { pointer-events: auto; }
    #talk { display: flex; align-items: center; gap: 10px; padding: 14px 26px; border: 0; border-radius: 999px; cursor: pointer;
            background: #3b6df0; color: #fff; font: 600 17px system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: background .2s; }
    #talk:hover:not(:disabled) { background: #2f5fe0; }
    #talk:disabled { background: #4a4f57; cursor: default; opacity: .8; }
    #talk.live { background: #d9443b; }
    #talk.live:hover { background: #c33a32; }
    #talk .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: .9; }
    #talk.live .dot { animation: pulse 1.2s ease-in-out infinite; }
    #talk.busy .dot { animation: pulse .6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
    #talkstatus { padding: 4px 12px; border-radius: 999px; background: rgba(20,22,26,.72); font-size: 13px; text-align: center; }
    #caption { max-width: 100%; padding: 8px 14px; border-radius: 10px; background: rgba(20,22,26,.72); backdrop-filter: blur(6px);
               font-size: 15px; line-height: 1.4; text-align: center; opacity: .8; }
    #caption.her { opacity: 1; }
    #caption:empty { display: none; }
    #phones { display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(20,22,26,.6); font-size: 12px; opacity: .85; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="/" title="Back to the patient list">← <b>Patients</b> <span id="caselabel"></span></a>
  <div id="status">Loading patient…</div>
  <div id="debug" hidden></div>
  <div id="talkbar" hidden></div>
  <script type="module">
    import { selectedSession, describeSession } from '/src/cases.js';
    const s = selectedSession();
    if (s) { const d = describeSession(s); document.getElementById('caselabel').textContent = `· ${d.who}, ${d.situation}`; }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
