<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultation · Meet Your AI Patient</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #e8eaed; font-family: system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #status { position: fixed; left: 12px; top: 50px; padding: 4px 10px; border-radius: 999px; background: rgba(20,22,26,.72); font-size: 13px; pointer-events: none; }
    #back { position: fixed; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; border-radius: 999px;
            background: rgba(20,22,26,.72); backdrop-filter: blur(6px); color: inherit; text-decoration: none; font-size: 13px; }
    #back:hover { background: rgba(20,22,26,.9); }
    #back[hidden] { display: none; }
    #back b { font-weight: 600; }
    #back span { opacity: .75; }
    #camera-tools { position: fixed; left: 12px; bottom: 12px; z-index: 8; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 24px); }
    #camera-tools button { min-height: 42px; padding: 0 16px; border: 1px solid rgba(255,255,255,.22); border-radius: 22px; cursor: pointer;
                           background: rgba(20,22,26,.78); backdrop-filter: blur(8px); color: #fff; font: 600 14px system-ui, sans-serif; }
    #camera-tools button:hover { background: rgba(40,44,52,.92); }
    #camera-tools button[aria-pressed="true"] { background: #2c6e67; }
    #camera-tools button[hidden], #camera-help[hidden], #chair-color-control[hidden] { display: none; }
    #chair-color-control { display: flex; align-items: center; gap: 8px; min-height: 42px; box-sizing: border-box; padding: 0 12px 0 15px; border-radius: 22px;
                           background: rgba(20,22,26,.78); backdrop-filter: blur(8px); color: #fff; font-size: 13px; font-weight: 600; }
    #chair-color { width: 28px; height: 28px; padding: 2px; border: 1px solid rgba(255,255,255,.35); border-radius: 50%; background: transparent; cursor: pointer; }
    #chair-color::-webkit-color-swatch-wrapper { padding: 0; }
    #chair-color::-webkit-color-swatch { border: 0; border-radius: 50%; }
    #camera-help { padding: 7px 11px; border-radius: 8px; background: rgba(20,22,26,.76); color: #fff; font-size: 12px; line-height: 1.25; pointer-events: none; }
    #debug { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 250px; padding: 12px; border-radius: 10px; overflow-y: auto;
             background: rgba(20,22,26,.88); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 8px; }
    #debug[hidden] { display: none; }
    #debug h3 { margin: 6px 0 0; font-size: 12px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
    #debug button { padding: 6px 4px; border: 1px solid #3a3f47; border-radius: 6px; background: #22262c; color: inherit; cursor: pointer; font-size: 13px; }
    #debug button.active { background: #3b6df0; border-color: #3b6df0; }
    #debug label { font-size: 12px; opacity: .85; display: flex; flex-direction: column; gap: 2px; }
    #debug label span { float: right; opacity: .6; }
    #debug .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    /* Talk dock (src/talk-ui.js): top right, above the SKID notes and clear of the patient's body.
       Buttons are 60px tall with 18px between them, so a glance on Apple Vision Pro selects exactly one. */
    #talkbar { position: fixed; top: 12px; right: 12px; width: min(640px, calc(100% - 24px)); display: flex; flex-direction: column;
               align-items: flex-end; gap: 10px; pointer-events: none; z-index: 5; }
    body.debug #talkbar { right: 274px; width: min(640px, calc(100% - 286px)); }   /* left of the debug panel */
    #talkbar[hidden] { display: none; }
    #talkbar > * { pointer-events: auto; }
    .dock-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 18px; }
    .dock-btn, #talkbar .vr-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; min-width: 60px;
            padding: 0 24px; border: 0; border-radius: 30px; cursor: pointer; background: rgba(20,22,26,.78); backdrop-filter: blur(8px);
            color: #fff; font: 600 17px system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: background .2s; }
    .dock-btn:hover:not(:disabled) { background: rgba(40,44,52,.92); }
    .dock-btn:focus-visible, #talkbar .vr-button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .dock-btn[hidden] { display: none; }
    .dock-btn[aria-pressed="true"] { background: #2c6e67; }
    #talk { background: #3b6df0; }
    #talk:hover:not(:disabled) { background: #2f5fe0; }
    #talk:disabled { background: #4a4f57; cursor: default; opacity: .8; }
    #talk.live { background: #d9443b; }
    #talk.live:hover { background: #c33a32; }
    #talk .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; opacity: .9; }
    #talk.live .dot { animation: pulse 1.2s ease-in-out infinite; }
    #talk.busy .dot { animation: pulse .6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
    /* three.js' ENTER VR button, restyled to match (its inline styles position it at the bottom of the page) */
    #talkbar .vr-button { position: static !important; width: auto !important; padding: 0 24px !important; border: 0 !important; border-radius: 30px !important;
            background: rgba(20,22,26,.78) !important; color: #fff !important; font: 600 17px system-ui, sans-serif !important; opacity: 1 !important; }
    #talkstatus { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; background: rgba(20,22,26,.72); font-size: 14px; }
    #talkstatus.error { background: rgba(150,40,34,.85); }
    #talkstatus .mic { --level: 0; position: relative; width: 44px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; flex: none; }
    #talkstatus .mic[hidden] { display: none; }
    #talkstatus .mic i { position: absolute; inset: 0; background: #5fd38d; transform-origin: left; transform: scaleX(var(--level)); transition: transform 60ms linear; }
    #talkstatus .mic.paused { opacity: .4; }
    #talkstatus .heard { padding: 2px 10px; border-radius: 999px; background: #2e7d50; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; }
    #talkstatus .heard[hidden] { display: none; }
    #caption { max-width: 100%; max-height: calc(4 * 1.4em + 16px); overflow-y: auto; box-sizing: border-box; padding: 8px 14px; border-radius: 10px;
               background: rgba(20,22,26,.72); backdrop-filter: blur(6px); font-size: 16px; line-height: 1.4; opacity: .8; }
    #caption.her { opacity: 1; }
    #caption:empty { display: none; }
    /* SKID notes: an HTML form placed in the room, to the student's right, by src/skid.js (CSS3DRenderer).
       Size must match PANEL.px there. */
    #skid { width: 560px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;
            border-radius: 14px; background: #f7f5f0; color: #1d2026; font: 14px/1.35 system-ui, sans-serif; box-shadow: 0 8px 40px rgba(0,0,0,.45); }
    /* buttons right after the title, not at the far edge: in a narrow window the form's right edge can be out of view */
    #skid header { display: flex; align-items: center; gap: 28px; padding: 10px 16px; background: #2f3a48; color: #fff; }
    #skid h2 { margin: 0; font-size: 17px; font-weight: 600; }
    #skid header .actions { display: flex; gap: 16px; }
    #skid header button { min-height: 40px; padding: 0 16px; border: 1px solid #5a6676; border-radius: 8px; background: transparent; color: inherit; font: inherit; font-size: 14px; cursor: pointer; }
    #skid header button:hover { background: rgba(255,255,255,.08); }
    #skid .body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 14px 16px; }
    #skid details { border-bottom: 1px solid #ddd7ca; padding: 2px 0 8px; }
    #skid summary { padding: 8px 2px 4px; font-weight: 600; cursor: pointer; }
    #skid .count { float: right; font-weight: 400; font-size: 12px; opacity: .6; }
    #skid .hint { margin: 2px 2px 6px; font-size: 12px; opacity: .65; }
    #skid .item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 2px; }
    #skid .rate { display: flex; gap: 3px; flex: none; }
    #skid .rate input { display: none; }
    #skid .rate span { display: block; width: 24px; padding: 2px 0; border: 1px solid #c9c2b4; border-radius: 5px; background: #fff; font-size: 12px; text-align: center; cursor: pointer; }
    #skid .rate input:checked + span { background: #3b6df0; border-color: #3b6df0; color: #fff; }
    #skid .rate input[value="3"]:checked + span { background: #c2453b; border-color: #c2453b; }
    #skid .field { display: block; margin-top: 6px; font-size: 12px; opacity: .85; }
    #skid textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; resize: vertical;
                     border: 1px solid #c9c2b4; border-radius: 6px; background: #fff; color: inherit; font: 14px/1.35 system-ui, sans-serif; }
    #modebadge { max-width: 100%; padding: 4px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 background: rgba(46,125,80,.85); color: #fff; }
    #modebadge.distracted { background: rgba(214,120,40,.9); }
    #modebadge.aggressive { background: rgba(196,56,48,.9); }
    #modebadge[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="/" title="Back to the patient list">← <b>Patients</b> <span id="caselabel"></span></a>
  <div id="camera-tools" aria-label="Camera controls">
    <button id="camera-mode" type="button" aria-pressed="false">Move camera</button>
    <button id="camera-reset" type="button" hidden>Reset view</button>
    <button id="camera-save" type="button" hidden>Save photo</button>
    <label id="chair-color-control">Chair <input id="chair-color" type="color" value="#ffffff" aria-label="Chair colour" /></label>
    <span id="camera-help" hidden>Drag: orbit · Right-drag: pan · Wheel: zoom</span>
  </div>
  <div id="status">Loading patient…</div>
  <div id="debug" hidden></div>
  <div id="talkbar" hidden></div>
  <script type="module">
    import { selectedSession, describeSession } from '/src/cases.js';
    const s = selectedSession();
    if (s) { const d = describeSession(s); document.getElementById('caselabel').textContent = `· ${d.name}, ${d.situation}`; }
    if (new URLSearchParams(location.search).has('debug')) document.body.classList.add('debug');
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
